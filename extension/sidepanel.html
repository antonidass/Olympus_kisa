<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="sidepanel.css" />
    <title>BOGI Promptr</title>
  </head>
  <body>
    <header>
      <div class="title-row">
        <h1>BOGI Promptr</h1>
        <div class="title-actions">
          <button id="back-btn" title="Откатить на предыдущую сцену — если по ошибке нажал Copy и хочешь вернуться к незавершённой">↩</button>
          <button id="reload-btn" title="Обновить список сценариев">↻</button>
        </div>
      </div>
      <div class="row">
        <select id="generator-select">
          <option value="flow">Flow (Google)</option>
          <option value="grok">Grok (xAI)</option>
        </select>
      </div>
      <div class="row">
        <select id="scenario-select">
          <option value="">— выбери сценарий —</option>
        </select>
      </div>
      <div class="row">
        <select id="kind-select">
          <option value="images">Картинки (images.md)</option>
          <option value="stickers">Стикеры (stickers.md)</option>
          <option value="video">Видео (video.md)</option>
        </select>
      </div>
      <div class="row status">
        <span id="progress">—</span>
      </div>
      <div class="row toggles">
        <label class="autocopy">
          <input id="download-images" type="checkbox" checked />
          скачать изображения
        </label>
        <label class="autocopy">
          <input id="download-stickers" type="checkbox" checked />
          скачать стикеры
        </label>
        <label class="autocopy">
          <input id="download-videos" type="checkbox" checked />
          скачать видео
        </label>
        <label class="autocopy" title="После импорта запустить distribute_{images,stickers,videos}.py — разложить файлы по сценам через subject-маркеры">
          <input id="auto-distribute" type="checkbox" checked />
          авто-разложить по сценам
        </label>
      </div>
    </header>
    <main id="prompts" class="prompts"></main>
    <footer>
      <div class="footer-head">
        <span>Лог</span>
        <button id="clear-log" title="Очистить лог">×</button>
      </div>
      <div id="log"></div>
    </footer>
    <script src="sidepanel.js"></script>
  </body>
</html>
